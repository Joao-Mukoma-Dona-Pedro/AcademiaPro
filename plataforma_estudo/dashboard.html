<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AcademiaPro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>AcademiaPro</h1>
  <nav>
    <a href="index.html">Início</a>
    <a href="cursos.html">Cursos</a>
    <a href="biblioteca.html">Biblioteca</a>
    <span style="color:#4ade80; font-weight:700;">
      Olá, João!
    </span>
    <a href="#">Sair</a>
  </nav>
</header>

<div class="dashboard">
  <div class="dashboard-topo">
    <h2>O teu painel</h2>
    <p>Continua do ponto onde ficaste.</p>
  </div>

  <div class="cards-grid" id="cards-container">
    <!-- Cards vão ser gerados pelo JS -->
  </div>
</div>

<footer>
  <p class="footer-copy">© 2026 AcademiaPro</p>
</footer>

<script>
// disciplinas simuladas (como se viessem da base de dados)
const disciplinas = [
  {
    id: 1,
    nome: "Álgebra",
    descricao: "Equações, variáveis e funções"
  },
  {
    id: 2,
    nome: "Física",
    descricao: "Leis do movimento e energia"
  },
  {
    id: 3,
    nome: "Química",
    descricao: "Reações químicas e moléculas"
  }
];

// gerar cards
function carregarDashboard() {
  const container = document.getElementById("cards-container");
  container.innerHTML = "";

  disciplinas.forEach(disc => {
    let progresso = localStorage.getItem("progresso_disciplina_" + disc.id) || 0;

    const card = `
      <div class="card">
        <h3>${disc.nome}</h3>
        <p>${disc.descricao}</p>

        <div class="progresso-barra-fundo">
          <div class="progresso-barra" style="width: ${progresso}%;"></div>
        </div>

        <p class="progresso-texto">${progresso}% concluído</p>

        <a href="disciplina.html?id=${disc.id}" 
           class="btn-primario" style="margin-top:12px; display:inline-block;">
          Continuar →
        </a>
      </div>
    `;

    container.innerHTML += card;
  });
}

// carregar ao abrir
window.onload = carregarDashboard;
</script>

</body>
</html>
